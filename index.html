<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Geniuszek od Pieluszek</title>
<meta name="theme-color" content="#5E2D65">
<link rel="icon" type="image/png" sizes="32x32" href="ikony/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="ikony/favicon-64.png">
<link rel="apple-touch-icon" href="ikony/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Geniuszek">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root {
    --fiolet: #5E2D65;
    --fiolet-ciemny: #47204d;
    --bez: #F6C6B4;
    --tlo: #FFF8F3;
    --tekst: #3a2340;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--tlo);
    color: var(--tekst);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column; min-height: 100dvh;
    /* viewport-fit=cover: sami pilnujemy, żeby nic nie wchodziło pod wycięcie ekranu i pasek */
    padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-tap-highlight-color: transparent;
  }
  header { display: flex; justify-content: center; padding: max(18px, calc(env(safe-area-inset-top) + 8px)) 16px 4px; }
  header img { height: 46px; width: auto; }

  .panel {
    display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-items: center;
    padding: 14px 16px 6px;
  }
  .wybor { position: relative; }
  select, button {
    font: inherit; font-size: 20px; font-weight: 600; border-radius: 14px; height: 54px;
  }
  select {
    appearance: none; -webkit-appearance: none;
    padding: 0 46px 0 18px; color: var(--fiolet); background: #fff;
    border: 2px solid var(--fiolet); cursor: pointer;
  }
  .wybor::after {
    content: ""; position: absolute; right: 18px; top: 50%; width: 10px; height: 10px;
    border-right: 3px solid var(--fiolet); border-bottom: 3px solid var(--fiolet);
    transform: translateY(-70%) rotate(45deg); pointer-events: none;
  }
  button#losuj {
    padding: 0 28px; border: 0; color: #fff; background: var(--fiolet); cursor: pointer;
    box-shadow: 0 4px 0 var(--fiolet-ciemny); transition: transform .08s, box-shadow .08s;
  }
  button#losuj:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--fiolet-ciemny); }
  button:focus-visible, select:focus-visible { outline: 3px solid var(--bez); outline-offset: 3px; }

  main {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    padding: 16px 12px 24px; min-height: 260px;
  }
  /* Wyśrodkowanie przez auto-marginesy: gdy karty się nie mieszczą, wychodzą w dół, a nie na przyciski. */
  main::after { content: ""; margin-top: auto; }
  #slowo { display: flex; flex-direction: column; align-items: center; gap: var(--odstep-wierszy, 0); margin-top: auto; }
  .linia { display: flex; align-items: center; gap: var(--odstep-slow, 0); }
  .wyraz { display: flex; align-items: center; }
  .karta {
    display: block; width: var(--w); height: calc(var(--w) * 0.7104); flex: none;
    border-radius: calc(var(--w) * 0.05);
    box-shadow: 3px 2px 10px rgba(60, 20, 70, .22);
    animation: wjazd .38s cubic-bezier(.2,.8,.3,1.2) both;
    user-select: none; -webkit-user-drag: none;
  }
  @keyframes wjazd {
    from { opacity: 0; transform: translateY(-26px) rotate(-3deg); }
    to   { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) { .karta { animation: none; } }
  @media (max-width: 440px) {
    select, button { font-size: 17px; height: 50px; }
    select { padding: 0 38px 0 14px; }
    .wybor::after { right: 15px; }
    button#losuj { padding: 0 18px; }
  }
  /* Telefon w poziomie: logo i przyciski w jednym rzędzie, żeby karty zmieściły się bez przewijania. */
  @media (orientation: landscape) and (max-height: 520px) {
    .gora { display: flex; align-items: center; justify-content: center; gap: 20px;
            padding: max(8px, env(safe-area-inset-top)) 16px 0; }
    header { padding: 0; }
    header img { height: 40px; }
    .panel { padding: 0; flex-wrap: nowrap; gap: 10px; }
    select, button { font-size: 17px; height: 46px; }
    select { padding: 0 38px 0 14px; }
    .wybor::after { right: 15px; }
    button#losuj { padding: 0 20px; }
    main { padding: 6px 12px 6px; min-height: auto; }
    details { margin-bottom: 4px; }
    summary { padding: 4px; }
  }
  #obroc { margin: 18px 0 12px; color: #9a879e; font-size: 15px; text-align: center; }
  .pusto { color: #8a6f8f; font-size: 18px; text-align: center; max-width: 30em; line-height: 1.5; }

  details {
    margin: 0 auto 18px; padding: 0 16px; max-width: 560px; width: 100%;
    color: #6d5872; font-size: 15px;
  }
  summary { cursor: pointer; text-align: center; padding: 6px; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "⚙︎ "; }
  .opcje { background: #fff; border-radius: 14px; padding: 12px 16px; margin-top: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .opcje label { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; cursor: pointer; line-height: 1.35; }
  .opcje input { width: 20px; height: 20px; margin: 0; flex: none; accent-color: var(--fiolet); }
  .opcje small { display: block; color: #9a879e; }
  .talie { display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: center; padding: 6px 0; line-height: 1.35; }
  .talie small { flex-basis: 100%; }
  .opcje .talie label { padding: 2px 0; align-items: center; gap: 8px; }
  #licznik { margin: 6px 0 0; color: #9a879e; text-align: right; }
</style>
</head>
<body>
<div class="gora">
  <header><img src="logo.png" alt="Geniuszek od Pieluszek"></header>

  <div class="panel">
    <label class="wybor">
      <select id="dlugosc" aria-label="Długość słowa albo zdanie">
        <optgroup label="Słowa">
          <option value="3">3 litery</option>
          <option value="4">4 litery</option>
          <option value="5">5 liter</option>
          <option value="6">6 liter</option>
          <option value="7">7 liter</option>
          <option value="8">8 liter</option>
          <option value="9+">9+ liter</option>
          <option value="los">Losowa długość</option>
        </optgroup>
        <optgroup label="Zdania">
          <option value="zk">Zdania krótkie (2–3 słowa)</option>
          <option value="zd">Zdania długie (4–5 słów)</option>
        </optgroup>
      </select>
    </label>
    <button id="losuj" type="button">Losuj słowo</button>
  </div>
</div>

<main>
  <div id="slowo" role="img" aria-live="polite">
    <p class="pusto">Wybierz długość słowa albo zdania i naciśnij przycisk losowania.</p>
  </div>
  <p id="obroc" hidden>↻ Obróć telefon poziomo – karty będą większe.</p>
</main>

<details>
  <summary>Ustawienia</summary>
  <div class="opcje">
    <div class="talie" role="radiogroup" aria-labelledby="talieOpis">
      <span id="talieOpis">Układam z:</span>
      <label><input type="radio" name="talie" value="1" checked> jednej talii</label>
      <label><input type="radio" name="talie" value="2"> dwóch talii</label>
      <small>Pokazuje tylko słowa i zdania, które da się ułożyć z tylu talii. W talii jest 51 kart:
      A ×3; E, K, M, O, T ×2; pozostałe po jednej.</small>
    </div>
    <label><input type="checkbox" id="bezDwuznakow">
      <span>Bez dwuznaków i zmiękczeń (sz, cz, ch, rz, dz, ni, si, ci, zi…)
      <small>Przydatne przed etapem 4 – same pojedyncze litery.</small></span></label>
    <p id="licznik"></p>
  </div>
</details>

<!-- ?v=… wymusza pobranie nowych plików po zmianie formatu danych (zwiększ przy takiej zmianie) -->
<script src="talia.js?v=3"></script>
<script src="slowa.js?v=3"></script>
<script src="zdania.js?v=3"></script>
<script src="zdania-liczby.js?v=3"></script>
<script src="generator.js?v=3"></script>
<script>
// Karty z talii: plik obrazka i jaka część karty (od lewej) chowa się pod poprzednią kartą,
// tak żeby z każdej kolejnej karty była widoczna mała litera (albo cały dwuznak).
const KARTY = {"a":{"f":"a.webp","h":0.5},"ą":{"f":"a-ogonek.webp","h":0.504},"b":{"f":"b.webp","h":0.475},"c":{"f":"c.webp","h":0.508},"ć":{"f":"c-kreska.webp","h":0.508},"d":{"f":"d.webp","h":0.492},"e":{"f":"e.webp","h":0.465},"ę":{"f":"e-ogonek.webp","h":0.465},"f":{"f":"f.webp","h":0.492},"g":{"f":"g.webp","h":0.504},"h":{"f":"h.webp","h":0.506},"i":{"f":"i.webp","h":0.479},"j":{"f":"j.webp","h":0.481},"k":{"f":"k.webp","h":0.5},"l":{"f":"l.webp","h":0.537},"ł":{"f":"l-kreska.webp","h":0.477},"m":{"f":"m.webp","h":0.477},"n":{"f":"n.webp","h":0.504},"ń":{"f":"n-kreska.webp","h":0.506},"o":{"f":"o.webp","h":0.5},"ó":{"f":"o-kreska.webp","h":0.504},"p":{"f":"p.webp","h":0.475},"r":{"f":"r.webp","h":0.533},"s":{"f":"s.webp","h":0.492},"ś":{"f":"s-kreska.webp","h":0.492},"t":{"f":"t.webp","h":0.515},"u":{"f":"u.webp","h":0.51},"w":{"f":"w.webp","h":0.577},"y":{"f":"y.webp","h":0.475},"z":{"f":"z.webp","h":0.494},"ź":{"f":"z-kreska.webp","h":0.494},"ż":{"f":"z-kropka.webp","h":0.494},"cz":{"f":"cz.webp","h":0.154},"ch":{"f":"ch.webp","h":0.131},"sz":{"f":"sz.webp","h":0.156},"rz":{"f":"rz.webp","h":0.204},"dż":{"f":"dz-kropka.webp","h":0.14},"dzi":{"f":"dzi.webp","h":0.065},"dź":{"f":"dz-kreska.webp","h":0.14},"ni":{"f":"ni.webp","h":0.208},"si":{"f":"si.webp","h":0.212},"ci":{"f":"ci.webp","h":0.208},"dz":{"f":"dz.webp","h":0.14},"zi":{"f":"zi.webp","h":0.21}};
const PROPORCJA = 341 / 480;   // wysokość / szerokość karty
const MAKS_SZER = 300;         // największa szerokość jednej karty w px
const ODSTEP_SLOW = 0.3;       // przerwa między słowami w zdaniu (w szerokościach karty)
const ODSTEP_WIERSZY = 0.16;   // przerwa między wierszami zdania (w szerokościach karty)

// Generator zdań (generator.js) – zna też skład talii (talia.js) i podział wyrazu na karty.
const GEN = GeneratorZdan.utworz(window.ZDANIA, window.TALIA);
const naKarty = GEN.naKarty;

const $ = id => document.getElementById(id);
const el = { dl: $("dlugosc"), losuj: $("losuj"), slowo: $("slowo"), bez: $("bezDwuznakow"), licznik: $("licznik"),
             talie: [...document.querySelectorAll('input[name="talie"]')] };
const talie = () => Number(el.talie.find(r => r.checked).value);   // z ilu talii układamy: 1 albo 2

// Zapamiętane ustawienia (jeśli przeglądarka pozwala).
const pamiec = {
  get(k, d) { try { const v = localStorage.getItem("gop_" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("gop_" + k, JSON.stringify(v)); } catch {} }
};
{ let z = String(pamiec.get("dl", "3")); if (z === "zdanie") z = "zk";
  el.dl.value = [...el.dl.options].some(o => o.value === z) ? z : "3"; }
{ const t = String(pamiec.get("talie", 1)); (el.talie.find(r => r.value === t) || el.talie[0]).checked = true; }
el.bez.checked = pamiec.get("bez", false);

const DLUGOSCI = ["3", "4", "5", "6", "7", "8", "9+"];
const trybZdan = () => el.dl.value === "zk" || el.dl.value === "zd";
const rodzajZdan = () => el.dl.value === "zk" ? "k" : "d";         // krótkie (2–3 słowa) albo długie (4–5 słów)

function tasuj(t) {
  for (let i = t.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [t[i], t[j]] = [t[j], t[i]]; }
  return t;
}

// ----- słowa -----
function pula(dl) {
  return (SLOWA[dl] || []).filter(x => x.t <= talie() && (!el.bez.checked || !x.d));
}

// „Worki” – osobny dla każdej długości; losujemy bez powtórzeń, dopóki nie przejdziemy całej puli.
const worki = {};
let ostatnie = null, biezace = null;
function zWorka(klucz, zrodlo) {
  const k = [klucz, talie(), el.bez.checked].join("|");
  let w = worki[k];
  if (!w || !w.length) {
    w = worki[k] = tasuj(zrodlo().slice());
    if (w.length > 1 && ostatnie && w[w.length - 1].s === ostatnie) w.unshift(w.pop());
  }
  return w.pop() || null;
}
function losujSlowo() {
  let dl = el.dl.value;
  if (dl === "los") {
    // Losowa długość: najpierw losujemy długość (każda równie prawdopodobna), potem słowo.
    const dostepne = DLUGOSCI.filter(d => pula(d).length);
    if (!dostepne.length) return null;
    let i = Math.floor(Math.random() * dostepne.length);
    if (dostepne.length > 1 && biezace && dostepne[i] === dlugoscSlowa(biezace)) i = (i + 1 + Math.floor(Math.random() * (dostepne.length - 1))) % dostepne.length;
    dl = dostepne[i];
  }
  const x = zWorka(dl, () => pula(dl));
  if (!x) return null;
  ostatnie = x.s;
  return { s: x.s, w: [x.k] };
}
function dlugoscSlowa(x) { return x.s.length >= 9 ? "9+" : String(x.s.length); }

// ----- zdania -----
// Zdania układa generator.js: losuje podmiot (każdy tak samo często) i dobiera do niego pasujące elementy,
// a mniej więcej co czwarte zdanie jest śmieszne. Od razu pomija zdania, których nie da się ułożyć z talii.
function losujZdanie() {
  const opcje = { talie: talie(), bezDwuznakow: el.bez.checked };
  let r = GEN.losuj(rodzajZdan(), opcje);
  if (r && r.s === ostatnie) r = GEN.losuj(rodzajZdan(), opcje) || r;
  if (!r) return null;
  ostatnie = r.s;
  return { s: r.s, w: r.w.map(naKarty) };
}

const losuj = () => trybZdan() ? losujZdanie() : losujSlowo();

// ----- układ i rysowanie -----
// Ile szerokości karty zajmuje wyraz: pierwsza karta cała (duża i mała litera, jak na prawdziwych kartach),
// z każdej kolejnej karty widać część (1 - h).
function jednostkiWyrazu(karty) {
  return 1 + karty.slice(1).reduce((s, k) => s + (1 - KARTY[k].h), 0);
}

// Wolne miejsce na karty: szerokość obszaru i wysokość ekranu pod przyciskami, bez „Ustawień” na dole.
function wolneMiejsce() {
  const main = el.slowo.parentElement;
  const gora = main.getBoundingClientRect().top + window.scrollY;
  const dol = document.querySelector("summary").offsetHeight + 34;
  return { szer: main.clientWidth - 24, wys: Math.max(110, window.innerHeight - gora - dol) };
}

// Dzieli wyrazy na wiersze tak, żeby karty były jak największe.
function uklad(wyrazy) {
  const { szer, wys } = wolneMiejsce();
  // Wszystkie podziały kolejnych wyrazów na wiersze (dla 5 wyrazów jest ich 16), od najmniejszej liczby wierszy.
  const podzialy = [];
  (function dalej(zostalo, akt) {
    if (!zostalo) { podzialy.push(akt); return; }
    for (let i = 1; i <= zostalo; i++) dalej(zostalo - i, akt.concat(i));
  })(wyrazy.length, []);
  podzialy.sort((a, b) => a.length - b.length);
  let najlepszy = null;
  for (const podzial of podzialy) {
    const wiersze = []; let i = 0;
    for (const ile of podzial) { wiersze.push(wyrazy.slice(i, i + ile)); i += ile; }
    const maksJedn = Math.max(...wiersze.map(r => r.reduce((s, karty) => s + jednostkiWyrazu(karty), 0) + ODSTEP_SLOW * (r.length - 1)));
    const L = wiersze.length;
    const w = Math.floor(Math.min(MAKS_SZER, szer / maksJedn, wys / (L * PROPORCJA + (L - 1) * ODSTEP_WIERSZY)));
    if (!najlepszy || w > najlepszy.w + 4) najlepszy = { w, wiersze };   // przy remisie mniej wierszy
  }
  return najlepszy;
}

function nowaKarta(k) {
  const img = document.createElement("img");
  img.className = "karta";
  img.src = "karty/" + KARTY[k].f;
  img.alt = k;
  img.draggable = false;
  return img;
}

function pokaz(x, animuj = true) {
  biezace = x;
  el.slowo.innerHTML = "";
  if (!x) {
    el.slowo.innerHTML = '<p class="pusto">Brak ' + (trybZdan() ? "zdań" : "słów") + ' dla tych ustawień. Zmień wybór albo ustawienia.</p>';
    el.slowo.removeAttribute("aria-label");
    $("obroc").hidden = true;
    return;
  }
  const { w, wiersze } = uklad(x.w);
  el.slowo.style.setProperty("--w", w + "px");
  el.slowo.style.setProperty("--odstep-slow", (ODSTEP_SLOW * w) + "px");
  el.slowo.style.setProperty("--odstep-wierszy", (ODSTEP_WIERSZY * w) + "px");
  $("obroc").hidden = !(w < 90 && window.innerHeight > window.innerWidth);
  el.slowo.setAttribute("aria-label", x.s);
  let nr = 0;
  const wszystkich = x.w.reduce((s, k) => s + k.length, 0);
  for (const wiersz of wiersze) {
    const linia = document.createElement("div");
    linia.className = "linia";
    for (const karty of wiersz) {
      const wyraz = document.createElement("div");
      wyraz.className = "wyraz";
      karty.forEach((k, i) => {
        const karta = nowaKarta(k);
        karta.style.zIndex = String(wszystkich - nr);                    // wcześniejsza karta na wierzchu
        if (i > 0) karta.style.marginLeft = (-KARTY[k].h * w) + "px";
        karta.style.animationDelay = animuj ? (nr * 90) + "ms" : "0ms";
        if (!animuj) karta.style.animation = "none";
        wyraz.appendChild(karta);
        nr++;
      });
      linia.appendChild(wyraz);
    }
    el.slowo.appendChild(linia);
  }
}

function odmiana(n, jeden, kilka, wiele) {
  return n === 1 ? jeden : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? kilka : wiele;
}
function odswiez() {
  let n;
  if (trybZdan()) {
    n = ((window.ZDANIA_LICZBY || {})[rodzajZdan()] || {})[talie()];
    n = n ? n[el.bez.checked ? 1 : 0] : 0;
    const ile = n >= 10000 ? "ok. " + Math.round(n / 1000) + " tys. zdań" : n + " " + odmiana(n, "zdanie", "zdania", "zdań");
    el.licznik.textContent = "W puli: " + ile + ". Do tego co czwarte losowane zdanie jest śmieszne.";
  } else {
    n = el.dl.value === "los" ? DLUGOSCI.reduce((a, d) => a + pula(d).length, 0) : pula(el.dl.value).length;
    el.licznik.textContent = "W puli: " + n + " " + odmiana(n, "słowo", "słowa", "słów");
  }
  el.losuj.textContent = trybZdan() ? "Losuj zdanie" : "Losuj słowo";
}

el.losuj.addEventListener("click", () => pokaz(losuj()));
el.dl.addEventListener("change", () => { pamiec.set("dl", el.dl.value); odswiez(); pokaz(losuj()); });
el.talie.forEach(r => r.addEventListener("change", () => { pamiec.set("talie", talie()); odswiez(); }));
el.bez.addEventListener("change", () => { pamiec.set("bez", el.bez.checked); odswiez(); });
document.addEventListener("keydown", e => {
  if ((e.key === " " || e.key === "Enter") && !["SELECT", "INPUT", "BUTTON", "SUMMARY"].includes(document.activeElement.tagName)) {
    e.preventDefault(); pokaz(losuj());
  }
});

// Po zmianie rozmiaru/obróceniu: przelicz karty. iOS podaje nowe wymiary z opóźnieniem, a czasem zostawia
// stronę przesuniętą – dlatego po obróceniu wracamy na górę i liczymy jeszcze raz chwilę później.
let tResize;
const przerysuj = () => biezace && pokaz(biezace, false);
window.addEventListener("resize", () => { clearTimeout(tResize); tResize = setTimeout(przerysuj, 120); });
function poObroceniu() {
  [150, 500, 1000].forEach(t => setTimeout(() => { window.scrollTo(0, 0); przerysuj(); }, t));
}
window.addEventListener("orientationchange", poObroceniu);
if (screen.orientation) screen.orientation.addEventListener("change", poObroceniu);

// Wczytaj obrazki kart z wyprzedzeniem, żeby losowanie było natychmiastowe.
Object.values(KARTY).forEach(k => { const i = new Image(); i.src = "karty/" + k.f; });
odswiez();
</script>
</body>
</html>
